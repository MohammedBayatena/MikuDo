# Publishes MikuDo as a GitHub release whenever dev or main moves, or when run
# by hand from the Actions tab on either of them.
#
# main makes a release: the last release's version, one minor step up
# (v1.4.0 -> v1.5.0). dev makes a pre-release of the version main releases
# next, numbered in turn: v1.5.0-dev.1, v1.5.0-dev.2, and so on. "#patch" or
# "#major" in the commit message takes that step instead, and a run by hand
# picks it. With no release yet, the first is v1.0.0.
name: Release

on:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version goes up
        type: choice
        options: [minor, patch, major]
        default: minor

# One release at a time, each finishing, so two never take the same number.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Publish and release
    # A run by hand on any other branch has nothing to release.
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # every tag, to find the last release

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Next version
        id: version
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
          MESSAGE: ${{ github.event.head_commit.message }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # The last full release; pre-releases carry a "-" and are left out.
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -v -- - | head -n 1 || true)
          bump="${BUMP:-minor}"
          case "$MESSAGE" in
            *"#major"*) bump=major ;;
            *"#patch"*) bump=patch ;;
          esac
          if [ -z "$last" ]; then
            next=1.0.0
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            case "$bump" in
              major) next="$((major + 1)).0.0" ;;
              minor) next="$major.$((minor + 1)).0" ;;
              patch) next="$major.$minor.$((patch + 1))" ;;
            esac
          fi
          if [ "$BRANCH" = main ]; then
            suffix=""
            prerelease=false
          else
            count=$(git tag --list "v$next-dev.*" | wc -l)
            suffix="dev.$((count + 1))"
            prerelease=true
          fi
          tag="v$next${suffix:+-$suffix}"
          echo "Last release: ${last:-none}. A $bump step on $BRANCH makes $tag."
          {
            echo "last=$last"
            echo "prefix=$next"
            echo "suffix=$suffix"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      # The same build the README describes, stamped with the version. The
      # About page reads the number; a pre-release's "-dev.N" rides along in
      # the product version.
      - name: Publish
        run: >
          dotnet publish MikuDo/MikuDo.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:VersionPrefix=${{ steps.version.outputs.prefix }}
          -p:VersionSuffix=${{ steps.version.outputs.suffix }}
          -o publish

      # MikuDo.exe needs the native libraries published beside it (WPF's,
      # WebView2's, and the AI and speech runtimes), so the release is the
      # whole folder, zipped. Debug symbols and API docs stay out.
      - name: Package
        shell: pwsh
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          Remove-Item publish/*.pdb, publish/*.xml -ErrorAction SilentlyContinue
          Compress-Archive -Path publish/* -DestinationPath "MikuDo-$env:TAG-win-x64.zip"

      # A pre-release is marked as one, so the latest full release stays the
      # one GitHub offers first. A release's notes run from the last full
      # release, taking in every pre-release since.
      - name: Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          LAST: ${{ steps.version.outputs.last }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease)
          elif [ -n "$LAST" ]; then
            flags+=(--notes-start-tag "$LAST")
          fi
          gh release create "$TAG" "MikuDo-$TAG-win-x64.zip" \
            --target "$GITHUB_SHA" \
            --title "MikuDo ${TAG#v}" \
            --generate-notes \
            "${flags[@]}"
