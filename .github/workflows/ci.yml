# Builds MikuDo and checks it on every push to dev and every pull request into
# dev or main. Release runs it too, before it publishes anything.
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
  workflow_call:
  workflow_dispatch:

# A newer push to the same branch makes an older run pointless; a release's
# own run of these checks is left to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow == 'CI' }}

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore
        run: dotnet restore MikuDo.sln

      - name: Build
        run: dotnet build MikuDo.sln -c Release --no-restore

      # Runs every test project in the solution, whenever there are any.
      - name: Test
        run: dotnet test MikuDo.sln -c Release --no-build

      # The five themes hold their contrast targets, and the XAML in the repo
      # is what tools/theme_studio.py writes, not hand edits that drifted.
      - name: Themes
        shell: bash
        run: |
          out="$RUNNER_TEMP/themes"
          mkdir -p "$out"
          python tools/theme_studio.py --write "$out"
          for f in "$out"/*.xaml; do
            diff --strip-trailing-cr -q "MikuDo/Themes/$(basename "$f")" "$f"
          done
